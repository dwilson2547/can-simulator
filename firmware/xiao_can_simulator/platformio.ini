[env:xiao_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32s3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

; Boots requiring acks (TWAI NORMAL), like a real ECU. With only a listen-only
; dongle on the port, frames are resent until acked: the isolated-OBD-segment case.
[env:xiao_s3_ack]
extends = env:xiao_s3
build_flags =
    ${env:xiao_s3.build_flags}
    -D SIM_REQUIRE_ACK=1
